<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS 校園地圖 — CampusOps</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=20260805a">
</head>
<body data-page="map" data-roles="manager,inspector">
<a class="skip-link" href="#page-main">跳到主要內容</a>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <header class="topbar" id="topbar-mount" data-title="GIS 校園地圖" data-breadcrumb="Map"></header>
    <div id="demo-banner-mount" class="demo-banner"></div>
    <main class="page" id="page-main" data-page-content>
      <div class="page-header">
        <div>
          <div class="page-title">GIS 校園地圖</div>
          <div class="page-subtitle">點擊地圖上的標記可查看工單摘要，並可進入工單詳情</div>
        </div>
      </div>
      <div id="map-root"></div>
    </main>
  </div>
  <div class="sidebar-scrim"></div>
</div>

<script src="js/main.js"></script>
<script src="js/data.js"></script>
<script src="js/shell.js"></script>
<script>
(function () {
  "use strict";
  if (!window.CO_PAGE_ALLOWED) return;

  var CO = window.CO, D = window.CO_DATA, ico = CO.icon;
  var root = document.getElementById("map-root");
  var forcedState = CO.demoStateParam();

  if (forcedState === "loading") { root.innerHTML = CO.stateBlockHtml("loading"); return; }
  if (forcedState === "error") {
    root.innerHTML = CO.stateBlockHtml("error", { message: "無法載入 GIS 校園地圖資料，可能是定位服務暫時無回應。" });
    root.querySelector("[data-retry]").addEventListener("click", function () { var u = new URL(location.href); u.searchParams.delete("demo"); location.href = u.pathname; });
    return;
  }

  var allOrders = forcedState === "empty" ? [] : D.load("workOrders").filter(function (w) { return w.status !== "done" && w.status !== "rejected"; });

  var state = { building: "all", facility: {}, risk: {} };
  D.FACILITY_TYPES.forEach(function (f) { state.facility[f.id] = true; });
  Object.keys(D.RISK_LEVELS).forEach(function (r) { state.risk[r] = true; });
  var activeMarkerId = null;

  root.innerHTML =
    '<div class="map-layout">' +
    '<div class="map-panel"><div class="card-body">' +
      '<div class="map-filter-group"><h4>建築物</h4>' +
        '<div class="select-wrap"><select id="filter-building"><option value="all">全部建築</option>' +
        D.BUILDINGS.map(function (b) { return '<option value="' + b.id + '">' + b.name + "</option>"; }).join("") +
        "</select>" + ico("chevronDown") + "</div>" +
      "</div>" +
      '<div class="map-filter-group"><h4>設施圖層</h4>' +
      D.FACILITY_TYPES.map(function (f) {
        return '<label class="layer-row"><input type="checkbox" data-layer="' + f.id + '" checked><span class="layer-swatch" style="background:' + f.swatch + ';"></span>' + f.name + "</label>";
      }).join("") +
      "</div>" +
      '<div class="map-filter-group"><h4>風險等級</h4>' +
      Object.keys(D.RISK_LEVELS).map(function (r) {
        return '<label class="layer-row"><input type="checkbox" data-risk="' + r + '" checked> <span class="badge ' + D.RISK_LEVELS[r].badge + '"><span class="dot"></span>' + D.RISK_LEVELS[r].label + "</span></label>";
      }).join("") +
      "</div>" +
      '<div class="map-filter-group"><h4>圖例</h4>' +
      '<div class="legend-row"><span class="dot-lg" style="background:var(--color-neutral);"></span>一般</div>' +
      '<div class="legend-row"><span class="dot-lg" style="background:var(--color-caution-dot);"></span>注意</div>' +
      '<div class="legend-row"><span class="dot-lg" style="background:var(--color-risk-dot);"></span>高風險</div>' +
      '<div class="legend-row"><span class="dot-lg" style="background:var(--color-danger-dot);"></span>逾期（閃爍提示）</div>' +
      "</div>" +
    "</div></div>" +
    '<div class="map-canvas-wrap"><div class="map-canvas" id="map-canvas"><div class="map-popover" id="map-popover"></div></div></div>' +
    '<div class="map-panel"><div class="card-body">' +
      '<h4 style="font-size:12px;font-weight:700;color:var(--color-text-faint);text-transform:uppercase;margin-bottom:10px;">目前顯示的工單（<span id="list-count">0</span>）</h4>' +
      '<div id="map-list"></div>' +
    "</div></div>" +
    "</div>";

  var canvas = document.getElementById("map-canvas");
  var popover = document.getElementById("map-popover");

  D.BUILDINGS.forEach(function (b) {
    var el = document.createElement("div");
    el.className = "map-building";
    el.style.left = b.x + "%"; el.style.top = b.y + "%"; el.style.width = b.w + "%"; el.style.height = b.h + "%";
    el.innerHTML = b.name + '<span class="b-code">' + b.floors + " 層樓 · " + b.id + " 棟</span>";
    canvas.appendChild(el);
  });

  // y kept >= 0.52 so markers cluster below the building name label (which sits at the top of the box)
  var OFFSETS = [[0.26, 0.55], [0.74, 0.55], [0.26, 0.85], [0.74, 0.85], [0.5, 0.7]];

  function buildingOrderIndex(w) {
    return allOrders.filter(function (o) { return o.buildingId === w.buildingId; }).indexOf(w);
  }

  function markerEls() { return Array.prototype.slice.call(canvas.querySelectorAll(".map-marker")); }

  function passesFilter(w) {
    if (state.building !== "all" && w.buildingId !== state.building) return false;
    if (!state.facility[w.facilityType]) return false;
    if (!state.risk[w.riskLevel]) return false;
    return true;
  }

  function renderMarkers() {
    markerEls().forEach(function (m) { m.remove(); });
    var visible = allOrders.filter(passesFilter);
    visible.forEach(function (w) {
      var bld = D.building(w.buildingId);
      var idx = buildingOrderIndex(w) % OFFSETS.length;
      var off = OFFSETS[idx];
      var x = bld.x + bld.w * off[0];
      var y = bld.y + bld.h * off[1];
      var risk = D.RISK_LEVELS[w.riskLevel];
      var fac = D.facility(w.facilityType);
      var marker = document.createElement("button");
      marker.type = "button";
      marker.className = "map-marker " + risk.markerClass;
      marker.style.left = x + "%"; marker.style.top = y + "%";
      marker.setAttribute("aria-label", w.title);
      marker.setAttribute("data-id", w.id);
      marker.innerHTML = ico(fac.icon);
      marker.addEventListener("click", function (e) { e.stopPropagation(); openPopover(w, marker); });
      canvas.appendChild(marker);
    });
    renderList(visible);
  }

  function openPopover(w, markerEl) {
    activeMarkerId = w.id;
    var risk = D.RISK_LEVELS[w.riskLevel], status = D.STATUS_META[w.status];
    popover.innerHTML =
      '<button type="button" class="mp-close" data-mp-close>' + ico("x") + "</button>" +
      "<h4>" + w.title + "</h4>" +
      '<div class="mp-meta">' +
      "<span>" + w.buildingName + " " + w.floor + " · " + w.location + "</span>" +
      "<span>" + w.facilityLabel + " · " + w.sourceLabel + (w.reporterName ? "（" + w.reporterName + "）" : "") + "</span>" +
      "<span>SLA 期限：" + D.fmtDate(w.slaDueAt) + "</span>" +
      "</div>" +
      '<div class="flex gap-6" style="margin-bottom:10px;"><span class="badge ' + risk.badge + '"><span class="dot"></span>' + risk.label + '</span><span class="badge ' + status.badge + '">' + status.label + "</span></div>" +
      '<a class="btn btn-primary btn-sm btn-block" href="workorder-detail.html?id=' + w.id + '">查看工單詳情</a>';
    var left = parseFloat(markerEl.style.left), top = parseFloat(markerEl.style.top);
    var canvasRect = canvas.getBoundingClientRect();
    var px = (left / 100) * canvasRect.width, py = (top / 100) * canvasRect.height;
    var popW = 268;
    var maxLeft = canvasRect.width - popW - 10;
    popover.style.left = Math.max(6, Math.min(px + 16, maxLeft)) + "px";
    popover.style.top = Math.max(6, Math.min(py - 20, canvasRect.height - 220)) + "px";
    popover.classList.add("open");
  }
  function closePopover() { popover.classList.remove("open"); activeMarkerId = null; }

  canvas.addEventListener("click", function (e) { if (!e.target.closest(".map-marker") && !e.target.closest(".map-popover")) closePopover(); });
  popover.addEventListener("click", function (e) { if (e.target.closest("[data-mp-close]")) closePopover(); });

  function renderList(visible) {
    document.getElementById("list-count").textContent = visible.length;
    var listMount = document.getElementById("map-list");
    if (!visible.length) {
      listMount.innerHTML = CO.stateBlockHtml("empty", { message: "沒有符合目前篩選條件的工單標記。" });
      var clearBtn = listMount.querySelector("[data-clear-filters]");
      if (clearBtn) clearBtn.addEventListener("click", resetFilters);
      return;
    }
    listMount.innerHTML = visible.map(function (w) {
      var risk = D.RISK_LEVELS[w.riskLevel];
      return (
        '<div class="card" style="padding:10px 12px;margin-bottom:8px;cursor:pointer;" data-list-item="' + w.id + '">' +
        '<div class="flex justify-between items-center gap-8"><span class="cell-primary text-sm">' + w.title + '</span><span class="badge ' + risk.badge + '"><span class="dot"></span>' + risk.label + "</span></div>" +
        '<div class="text-faint text-sm mt-8">' + w.buildingName + " " + w.floor + "</div>" +
        "</div>"
      );
    }).join("");
    listMount.querySelectorAll("[data-list-item]").forEach(function (card) {
      card.addEventListener("click", function () {
        var id = card.getAttribute("data-list-item");
        var marker = canvas.querySelector('.map-marker[data-id="' + id + '"]');
        var w = allOrders.filter(function (o) { return o.id === id; })[0];
        if (marker && w) openPopover(w, marker);
      });
    });
  }

  function resetFilters() {
    state.building = "all";
    D.FACILITY_TYPES.forEach(function (f) { state.facility[f.id] = true; });
    Object.keys(D.RISK_LEVELS).forEach(function (r) { state.risk[r] = true; });
    document.getElementById("filter-building").value = "all";
    root.querySelectorAll("[data-layer], [data-risk]").forEach(function (cb) { cb.checked = true; });
    closePopover();
    renderMarkers();
  }

  document.getElementById("filter-building").addEventListener("change", function (e) { state.building = e.target.value; closePopover(); renderMarkers(); });
  root.querySelectorAll("[data-layer]").forEach(function (cb) {
    cb.addEventListener("change", function () { state.facility[cb.getAttribute("data-layer")] = cb.checked; closePopover(); renderMarkers(); });
  });
  root.querySelectorAll("[data-risk]").forEach(function (cb) {
    cb.addEventListener("change", function () { state.risk[cb.getAttribute("data-risk")] = cb.checked; closePopover(); renderMarkers(); });
  });

  renderMarkers();
})();
</script>
</body>
</html>
