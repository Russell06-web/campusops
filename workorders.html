<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工單管理 — CampusOps</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=20260805a">
</head>
<body data-page="workorders" data-roles="manager,tech">
<a class="skip-link" href="#page-main">跳到主要內容</a>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <header class="topbar" id="topbar-mount" data-title="工單管理" data-breadcrumb="Work Orders"></header>
    <div id="demo-banner-mount" class="demo-banner"></div>
    <main class="page" id="page-main" data-page-content>
      <div class="page-header">
        <div>
          <div class="page-title">工單管理</div>
          <div class="page-subtitle" id="page-subtitle">搜尋、篩選並追蹤所有巡檢與通報產生的工單</div>
        </div>
      </div>

      <div class="card">
        <div class="table-toolbar">
          <div class="table-search"><span id="search-icon-mount"></span><input type="search" id="search-input" placeholder="搜尋工單編號、標題或位置…"></div>
          <div class="table-filters">
            <div class="select-wrap"><select id="filter-building"><option value="all">全部建築</option></select></div>
            <div class="select-wrap"><select id="filter-type"><option value="all">全部類型</option></select></div>
            <div class="select-wrap"><select id="filter-risk">
              <option value="all">全部風險</option><option value="normal">一般</option><option value="caution">注意</option><option value="high">高風險</option><option value="overdue">逾期</option>
            </select></div>
            <div class="select-wrap"><select id="filter-status">
              <option value="all">全部狀態</option><option value="pending">待分派</option><option value="assigned">已指派</option><option value="inprogress">處理中</option><option value="review">待驗收</option><option value="done">已完成</option><option value="rejected">退回</option>
            </select></div>
          </div>
        </div>
        <div id="table-mount"></div>
      </div>
    </main>
  </div>
  <div class="sidebar-scrim"></div>
</div>

<script src="js/main.js"></script>
<script src="js/data.js"></script>
<script src="js/shell.js"></script>
<script>
(function () {
  "use strict";
  if (!window.CO_PAGE_ALLOWED) return;
  var CO = window.CO, D = window.CO_DATA, ico = CO.icon;
  document.getElementById("search-icon-mount").innerHTML = ico("search");
  var forcedState = CO.demoStateParam();

  var buildingSelect = document.getElementById("filter-building");
  D.BUILDINGS.forEach(function (b) { buildingSelect.insertAdjacentHTML("beforeend", '<option value="' + b.id + '">' + b.name + "</option>"); });
  var typeSelect = document.getElementById("filter-type");
  D.FACILITY_TYPES.forEach(function (f) { typeSelect.insertAdjacentHTML("beforeend", '<option value="' + f.id + '">' + f.name + "</option>"); });

  var role = window.CO_SHELL.currentRole();
  var allOrders = D.load("workOrders");
  if (role === "tech") {
    var myName = D.STAFF.technicians[0].name;
    allOrders = allOrders.filter(function (w) { return w.assignee === myName; });
    document.getElementById("page-subtitle").textContent = "目前顯示指派給「" + myName + "」的工單";
  }
  if (forcedState === "empty") allOrders = [];

  var mount = document.getElementById("table-mount");
  if (forcedState === "loading") { mount.innerHTML = CO.stateBlockHtml("loading"); return; }
  if (forcedState === "error") {
    mount.innerHTML = CO.stateBlockHtml("error", { message: "無法載入工單清單，請稍後再試。" });
    mount.querySelector("[data-retry]").addEventListener("click", function () { var u = new URL(location.href); u.searchParams.delete("demo"); location.href = u.pathname; });
    return;
  }

  var table = new CO.TableController({
    data: allOrders,
    mount: mount,
    pageSize: 8,
    searchKeys: ["id", "title", "location", "buildingName"],
    defaultSort: "slaDueAt",
    emptyOpts: { message: "沒有符合條件的工單，試著調整篩選條件。" },
    rowClick: function (id) { window.location.href = "workorder-detail.html?id=" + id; },
    columns: [
      { key: "id", label: "工單編號", sortable: true },
      { key: "title", label: "標題", sortable: false },
      { key: "buildingName", label: "位置", sortable: true },
      { key: "facilityLabel", label: "類型", sortable: false },
      { key: "riskLevel", label: "風險", sortable: true },
      { key: "status", label: "狀態", sortable: true },
      { key: "slaDueAt", label: "SLA 期限", sortable: true }
    ],
    renderRow: function (w) {
      var risk = D.RISK_LEVELS[w.riskLevel], status = D.STATUS_META[w.status];
      return (
        '<tr class="row-link" data-row-id="' + w.id + '">' +
        '<td data-label="工單編號"><span class="cell-mono">' + w.id + "</span></td>" +
        '<td data-label="標題"><span class="cell-primary">' + w.title + '</span><div class="cell-muted">' + w.sourceLabel + (w.reporterName ? " · " + w.reporterName : "") + "</div></td>" +
        '<td data-label="位置">' + w.buildingName + " " + w.floor + '<div class="cell-muted">' + w.location + "</div></td>" +
        '<td data-label="類型">' + w.facilityLabel + "</td>" +
        '<td data-label="風險"><span class="badge ' + risk.badge + '"><span class="dot"></span>' + risk.label + "</span></td>" +
        '<td data-label="狀態"><span class="badge ' + status.badge + '">' + status.label + "</span></td>" +
        '<td data-label="SLA 期限">' + D.fmtDate(w.slaDueAt) + "</td>" +
        "</tr>"
      );
    }
  });
  table.render();

  document.getElementById("search-input").addEventListener("input", function (e) { table.setSearch(e.target.value); });
  document.getElementById("filter-building").addEventListener("change", function (e) { table.setFilter("buildingId", e.target.value); });
  document.getElementById("filter-type").addEventListener("change", function (e) { table.setFilter("facilityType", e.target.value); });
  document.getElementById("filter-risk").addEventListener("change", function (e) { table.setFilter("riskLevel", e.target.value); });
  document.getElementById("filter-status").addEventListener("change", function (e) { table.setFilter("status", e.target.value); });

  window.__coResetFilterUI = function () {
    document.getElementById("search-input").value = "";
    ["filter-building", "filter-type", "filter-risk", "filter-status"].forEach(function (id) { document.getElementById(id).value = "all"; });
  };
})();
</script>
</body>
</html>
